x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:16
    container_name: web_reader_postgres
    logging: *default-logging
    environment:
      POSTGRES_DB: web_reader
      POSTGRES_USER: web_reader
      POSTGRES_PASSWORD: web_reader
    ports:
      - "${POSTGRES_HOST_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: web_reader_redis
    logging: *default-logging
    ports:
      - "${REDIS_HOST_PORT:-16379}:6379"

  minio:
    image: quay.io/minio/minio:RELEASE.2025-06-13T11-33-47Z
    container_name: web_reader_minio
    logging: *default-logging
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "${MINIO_API_HOST_PORT:-19000}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-19001}:9001"
    volumes:
      - minio_data:/data

networks:
  default:
    external: true
    name: web_reader

volumes:
  postgres_data:
    external: true
    name: web_reader_postgres_data
  minio_data:
    external: true
    name: web_reader_minio_data
