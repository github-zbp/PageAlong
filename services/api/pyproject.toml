[project]
name = "web-reader-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13.2",
  "boto3>=1.34.150",
  "celery[redis]>=5.4.0",
  "edge-tts>=7.0.0",
  "fastapi>=0.111.1",
  "httpx>=0.27.0",
  "lxml>=5.2.0",
  "markdownify>=0.13.1",
  "pillow>=10.4.0",
  "psycopg[binary]>=3.2.1",
  "pydantic-settings>=2.3.4",
  "pypdf>=4.3.1",
  "python-multipart>=0.0.9",
  "python-docx>=1.1.2",
  "readability-lxml>=0.8.1",
  "reportlab>=4.2.2",
  "sqlalchemy>=2.0.31",
  "trafilatura>=1.12.2",
  "uvicorn[standard]>=0.30.3",
  "websockets>=12.0",
  "EbookLib>=0.18"
]

[project.optional-dependencies]
kokoro = [
  "kokoro-onnx>=0.5.0",
  "misaki[zh]>=0.7.4"
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["storage*", "tests*"]

[dependency-groups]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.3.2",
  "pytest-asyncio>=0.23.8",
  "ruff>=0.5.5"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
